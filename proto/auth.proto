syntax = "proto3";

package authpb;

option go_package = "github.com/role-play-dev/contarcts/authpb";

service AuthService {
    rpc SendLink(SendLinkRequest) returns (SendLinkResponce) {}
    rpc Register(RegisterRequest) returns (RegisterResponce) {}
    rpc Login(LoginRequest) returns (LoginResponce) {}
}

message SendLinkRequest {
    string email = 1;
    string client_address = 2;
}

message SendLinkResponce {
}

message RegisterRequest {
    string token = 1;
    string username = 2;
    string password = 3;
}

message RegisterResponce {

}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponce {
    string access_token = 1;
    string refresh_token = 2;
}

