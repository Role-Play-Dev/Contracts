# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go generate protobuf

on:
  push:
    tags:
      - 'v*'

jobs:
  generate_proto_contracts:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.5'

    - name: Install protobuff-compiler
      run: | 
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install protoc-gen-go 
      run: | 
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    
    - name: Generate proto contracts
      run: | 
        mkdir -p ./gen/protobuf/
        protoc -I proto proto/*.proto --go_out=./gen/protobuf/ --go_opt=paths=source_relative --go-grpc_out=./gen/protobuf/ --go-grpc_opt=paths=source_relative

    - name: Add deps
      run: go mod tidy

    - name: Commit generated contracts
      run: |
        git add ./gen/protobuf/ go.mod go.sum
        git commit -m "feat: update contracts [skip ci]"
        git push origin main

    - name: Bump version and create new tag
      run: |
        CURRENT_TAG="${{ github.ref_name }}"
        
        # 1. Убираем префикс 'v'
        VERSION="${CURRENT_TAG#v}"
        
        # 2. Разбиваем версию на части (предполагаем формат X.Y.Z)
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        PATCH=${PATCH:-0} # На случай, если тег был вида v1.2
        
        # 3. Инкрементируем PATCH (последнюю цифру) на 1
        NEW_PATCH=$((PATCH + 1))
        NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"

        echo "Создание нового тега: ${NEW_TAG} на основе ${CURRENT_TAG}"
        
        # 4. Создаем аннотированный тег и отправляем его в репозиторий
        git tag -a "${NEW_TAG}" -m "chore: release ${NEW_TAG} with generated contracts [skip ci]"
        git push origin "${NEW_TAG}"
        
        # 5. Сохраняем новый тег в переменную окружения GitHub для использования в следующих шагах
        echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
