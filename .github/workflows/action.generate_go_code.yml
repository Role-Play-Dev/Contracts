# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go generate protobuf

on:
  push:
    tags:
      - 'v*'

env:
  GENERATE_DIR: './gen/'
  PROTO_DIR: './proto'

jobs:
  generate_proto_contracts:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.5'

    - name: Install tools & Generate
      run: |
        sudo apt-get update && sudo apt-get install -y protobuf-compiler
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
        
        mkdir -p ${{ env.GENERATE_DIR }}
        protoc -I ${{ env.PROTO_DIR }} \
          --go_out=${{ env.GENERATE_DIR }} --go_opt=paths=source_relative \
          --go-grpc_out=${{ env.GENERATE_DIR }} --go-grpc_opt=paths=source_relative 
        
        go mod tidy

    - name: Commit changes (if any) and bump tag
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add -f ${{ env.GENERATE_DIR }} go.mod go.sum 2>/dev/null || true

        CURRENT_TAG="${{ github.ref_name }}"
        VERSION="${CURRENT_TAG#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        PATCH=${PATCH:-0}
        NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"

        echo "NEW TAG: ${NEW_TAG}"
        git tag -a "${NEW_TAG}" -m "release ${NEW_TAG} [skip ci]"
        git push origin "${NEW_TAG}"
